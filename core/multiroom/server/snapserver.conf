[server]
datadir = /var/cache/snapcast/
# Standard buffer (1 second is default)
buffer = 1000

[http]
enabled = true
bind_to_address = 0.0.0.0
port = 1780
doc_root = /var/www/

[stream]
# Standard ALSA configuration
stream = alsa://?name=balenaSound&device=pulse
# Match Spotify Lossless: 44.1 kHz, 24-bit, stereo.
sampleformat = 44100:24:2
# Uncompressed PCM preserves the source samples on the Snapcast stream.
codec = pcm

[logging]
filter = *:error
