version: "2"

volumes:
  spotifycache:
  plexcache:

services:
  # Core services
  # -- Required for a fully featured installation of balenaSound
  # -- Mutiroom services can be removed if not using multiroom mode
  audio:
    build: ./core/audio
    privileged: true
    labels:
      io.balena.features.dbus: 1
    ports:
      - 4317:4317

  sound-supervisor:
    build:
      context: .
      dockerfile: ./core/sound-supervisor/Dockerfile.template
    network_mode: host
    labels:
      io.balena.features.balena-api: "1"
      io.balena.features.supervisor-api: 1

  # client-master: this is a lean, client-only branch, so multiroom-server is disabled
  # multiroom-server:
  #   build: ./core/multiroom/server
  #   restart: on-failure
  #   ports:
  #     - 1704:1704
  #     - 1705:1705
  #     - 1780:1780

  multiroom-client:
    build: ./core/multiroom/client
    restart: on-failure
    depends_on:
      - audio
      # - multiroom-server

  # Plugins
  # -- Additional plugins can be added. See https://balena-sound.pages.dev/plugins
  # -- Remove unwanted plugins as needed
  # client-master: this is a lean, client-only branch, so bluetooth is disabled
  # bluetooth:
  #   build: ./plugins/bluetooth
  #   restart: on-failure
  #   network_mode: host
  #   cap_add:
  #     - NET_ADMIN
  #   labels:
  #     io.balena.features.dbus: 1

  # client-master: this is a lean, client-only branch, so airplay is disabled
  # airplay:
  #   build: ./plugins/airplay
  #   restart: on-failure
  #   network_mode: host
  #   privileged: true
  #   labels:
  #     io.balena.features.dbus: 1

  spotify:
    build: ./plugins/spotify
    restart: on-failure
    privileged: true
    network_mode: host
    volumes:
      - spotifycache:/var/cache/raspotify

  # tidal:
  #   build: ./plugins/tidal
  #   restart: on-failure
  #   privileged: true
  #   network_mode: host
  #   labels:
  #     io.balena.features.dbus: 1

  # plex:
  #   build: ./plugins/plex
  #   restart: on-failure
  #   privileged: true
  #   network_mode: host
  #   volumes:
  #     - plexcache:/var/cache/plex-mpv-shim
  #   environment:
  #     # No login/token required - plex-mpv-shim uses local GDM discovery
  #     # to register with a Plex Media Server on the same LAN.
  #     # If it doesn't appear as a cast target, check that your Plex Media
  #     # Server has "Enable local network discovery (GDM)" turned on under
  #     # Settings -> Network.
  #     SOUND_DEVICE_NAME: ""

  # https://github.com/balenablocks/hostname
  hostname:
    build: ./core/hostname
    restart: no
    labels:
      io.balena.features.supervisor-api: 1
    environment:
      SET_HOSTNAME: balena
